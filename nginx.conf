server {
    server_name qxch.at;

    root /home/anaissar/site/dist;
    index index.html;

    location = /app {
        return 301 /app/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4560;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:4560/ws;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }


    location /app/ {
        proxy_pass http://127.0.0.1:4560;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # An address that names nothing is sent to the front page, rather than
    # being served the front page under a URL that does not exist. If the
    # site ever gains client-side routes in history mode, list them here
    # with `try_files $uri /index.html;` so they are not redirected.
    location / {
        try_files $uri $uri/ @home;
    }

    location @home {
        return 302 /;
    }

    listen 443 ssl;
}
