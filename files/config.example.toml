[api]

domain = ""
publicDomain = "qxp.example.com"
port = 4560
adminPassword = ""

[network]

heartbeatInterval = 3000
latestVersion = ""
publicDir = "web/dist"
webchatIndex = "index.html"
uploadDir = "files/uploads"
uploadPublicBase = "/app/uploads"

[rtc]

relayOnly = true

# ── Multi-server TURN (recommended) ──────────────────────────────────
# Define one [[rtc.servers]] block per relay.  The client can choose
# which server to use per call from the Settings > Calls panel.
# The legacy flat fields (turnUrls / turnUsername / turnCredential)
# are still supported and are auto-promoted to a server with id "legacy".
#
# defaultTurnServer = "mon-serveur"   # id of the pre-selected server

[[rtc.servers]]
id = "mon-serveur"
label = "My TURN server"
hint = "Self-hosted relay on your infrastructure — no IP exposed."
turnUrls = [
  "turn:turn.qxp.example.com:3478?transport=udp",
  "turns:turn.qxp.example.com:5349?transport=tcp",
]
turnUsername = "qxp-turn"
turnCredential = "change-me"

